name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'package*.json'
      - 'scripts/**'
      - 'tests/**'
      - 'capacitor.config.json'
      - '.github/workflows/android-debug.yml'
permissions:
  contents: write
concurrency:
  group: android-publication
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install audio encoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Retrieve French anthem recording
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -A "CommunistWorldSimulator/1.0 (Wikimedia Commons CC0)" \
            'https://commons.wikimedia.org/wiki/Special:Redirect/file/The_Internationale_(French_Version).flac' \
            -o /tmp/internationale.flac
          ffmpeg -hide_banner -loglevel error -y -i /tmp/internationale.flac -t 135 -c:a libmp3lame -b:a 128k web/assets/internationale-francaise-extrait-135s.mp3
          test -s web/assets/internationale-francaise-extrait-135s.mp3
      - name: Check web assets
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Create native Android project
        run: npx cap add android
      - name: Sync packaged web assets
        run: npx cap sync android
      - name: Set Android version
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const p="android/app/build.gradle"; let s=fs.readFileSync(p,"utf8"); if(!/versionCode\s+\d+/.test(s)) throw Error("versionCode missing"); s=s.replace(/versionCode\s+\d+/,"versionCode "+process.env.BUILD_NUMBER); s=s.replace(/versionName\s+"[^"]+"/,"versionName \"0.1."+process.env.BUILD_NUMBER+"\""); fs.writeFileSync(p,s)'
      - name: Build release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_SIGNING" ]; then
            echo "::error::Missing ANDROID_SIGNING repository secret; no APK will be published."
            exit 1
          fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/cws-signing.p12"; unset KS_PASS' EXIT
          node -e 'const fs=require("fs"); const data=JSON.parse(process.env.ANDROID_SIGNING); fs.writeFileSync(process.env.RUNNER_TEMP+"/cws-signing.p12",Buffer.from(data.keystore,"base64"),{mode:0o600})'
          export KS_PASS="$(node -e 'process.stdout.write(JSON.parse(process.env.ANDROID_SIGNING).password)')"
          echo "::add-mask::$KS_PASS"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/cws-aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/cws-signing.p12" --ks-type PKCS12 --ks-key-alias communist-world --ks-pass env:KS_PASS --key-pass env:KS_PASS --out communist-world-simulator.apk "$RUNNER_TEMP/cws-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs communist-world-simulator.apk
          sha256sum communist-world-simulator.apk > communist-world-simulator.apk.sha256
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: communist-world-simulator-android
          path: |
            communist-world-simulator.apk
            communist-world-simulator.apk.sha256
          if-no-files-found: error
      - name: Publish public Android download
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --target "$GITHUB_SHA" --title "Communist World Simulator - Android" --notes "APK Android signée."
          fi
          gh release upload android-latest communist-world-simulator.apk communist-world-simulator.apk.sha256 --clobber
          gh release edit android-latest --notes "APK Android signée. Commit: $GITHUB_SHA"
